<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sukhdevi Alchemy</title>
  <script>
    // GitHub Pages SPA redirect — preserves the full path so the React app
    // can handle client-side routing (e.g. /cloudkitchen, /v2, /products/*).
    // pathSegmentsToKeep=0 because this site is served from the root domain.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/?p=' + encodeURIComponent(l.pathname + l.search) + (l.hash || '')
    );
  </script>
</head>
<body></body>
</html>
