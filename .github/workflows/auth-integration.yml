name: Auth Integration Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: auth-integration
  cancel-in-progress: true

jobs:
  auth-integration:
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_AUTH_REDIRECT_URL: ${{ secrets.VITE_AUTH_REDIRECT_URL }}
      TEST_SIGNIN_EMAIL: ${{ secrets.TEST_SIGNIN_EMAIL }}
      TEST_SIGNIN_PASSWORD: ${{ secrets.TEST_SIGNIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate required auth test secrets
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ] || [ -z "$TEST_SIGNIN_EMAIL" ] || [ -z "$TEST_SIGNIN_PASSWORD" ]; then
            echo "Missing required secrets: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, TEST_SIGNIN_EMAIL, TEST_SIGNIN_PASSWORD"
            exit 1
          fi

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run real auth integration check
        run: npm run test:auth:integration

      - name: Run browser auth smoke tests
        run: npm run test:e2e
