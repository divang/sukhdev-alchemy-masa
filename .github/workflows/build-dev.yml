name: Build Dev Channel

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build-dev:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Validate Required Dev Build Env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Missing required development environment secrets: VITE_SUPABASE_URL and/or VITE_SUPABASE_ANON_KEY"
            exit 1
          fi

      - name: Build Dev Bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_AUTH_REDIRECT_URL: ${{ secrets.VITE_AUTH_REDIRECT_URL }}
          VITE_DEV_MODE_ADMIN_EMAIL: ${{ secrets.VITE_DEV_MODE_ADMIN_EMAIL }}
          VITE_CATALOG_CACHE_BUSTER: dev-${{ github.sha }}-${{ secrets.VITE_CATALOG_CACHE_BUSTER }}
        run: npm run build

      - name: Upload Dev Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-dist
          path: dist
          if-no-files-found: error
